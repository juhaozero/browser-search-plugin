<!doctype html>
<html lang="en" data-locale="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SearchLayout</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="bsp-shell">
      <header class="bsp-hero">
        <div class="bsp-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
            <rect x="4" y="6" width="10" height="20" rx="2.5" fill="currentColor" opacity=".16"/>
            <rect x="18" y="6" width="10" height="20" rx="2.5" fill="currentColor" opacity=".16"/>
            <rect x="6" y="9" width="6" height="3" rx="1" fill="currentColor"/>
            <rect x="20" y="9" width="6" height="3" rx="1" fill="currentColor"/>
            <rect x="6" y="14.5" width="6" height="2" rx="1" fill="currentColor" opacity=".5"/>
            <rect x="20" y="14.5" width="6" height="2" rx="1" fill="currentColor" opacity=".5"/>
            <rect x="6" y="19" width="4.5" height="2" rx="1" fill="currentColor" opacity=".32"/>
            <rect x="20" y="19" width="4.5" height="2" rx="1" fill="currentColor" opacity=".32"/>
          </svg>
        </div>
        <div class="bsp-hero-copy">
          <div class="bsp-hero-top">
            <h1>SearchLayout</h1>
            <div class="bsp-lang" role="group" aria-label="Language">
              <button type="button" class="bsp-lang-btn is-active" data-locale="en" aria-pressed="true" data-i18n="langEn">EN</button>
              <button type="button" class="bsp-lang-btn" data-locale="zh" aria-pressed="false" data-i18n="langZh">中文</button>
            </div>
          </div>
          <p data-i18n="tagline">Cleaner, more readable search layouts</p>
        </div>
      </header>

      <form id="bsp-prefs" class="bsp-form">
        <section class="bsp-section" aria-labelledby="bsp-layout-title">
          <div class="bsp-section-head">
            <h2 id="bsp-layout-title" data-i18n="layout">Layout</h2>
            <span class="bsp-section-hint" data-i18n="layoutHint">Applies instantly</span>
          </div>

          <div class="bsp-mode-grid" role="radiogroup" aria-labelledby="bsp-layout-title">
            <label class="bsp-mode">
              <input type="radio" name="columnMode" value="original">
              <span class="bsp-mode-card">
                <span class="bsp-mode-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 28" width="40" height="28" fill="none">
                    <rect x="2" y="3" width="36" height="5" rx="2" fill="currentColor" opacity=".35"/>
                    <rect x="2" y="11.5" width="28" height="4" rx="2" fill="currentColor" opacity=".22"/>
                    <rect x="2" y="19.5" width="32" height="4" rx="2" fill="currentColor" opacity=".22"/>
                  </svg>
                </span>
                <span class="bsp-mode-text">
                  <span class="bsp-mode-title" data-i18n="modeOriginal">Original</span>
                  <span class="bsp-mode-desc" data-i18n="modeOriginalDesc">Keep the engine layout</span>
                </span>
              </span>
            </label>

            <label class="bsp-mode">
              <input type="radio" name="columnMode" value="single">
              <span class="bsp-mode-card">
                <span class="bsp-mode-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 28" width="40" height="28" fill="none">
                    <rect x="8" y="2" width="24" height="24" rx="4" fill="currentColor" opacity=".12"/>
                    <rect x="12" y="7" width="16" height="3" rx="1.5" fill="currentColor"/>
                    <rect x="12" y="13" width="16" height="2.5" rx="1.25" fill="currentColor" opacity=".45"/>
                    <rect x="12" y="18.5" width="12" height="2.5" rx="1.25" fill="currentColor" opacity=".3"/>
                  </svg>
                </span>
                <span class="bsp-mode-text">
                  <span class="bsp-mode-title" data-i18n="modeSingle">Single</span>
                  <span class="bsp-mode-desc" data-i18n="modeSingleDesc">Stack results vertically</span>
                </span>
              </span>
            </label>

            <label class="bsp-mode">
              <input type="radio" name="columnMode" value="single-center">
              <span class="bsp-mode-card">
                <span class="bsp-mode-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 28" width="40" height="28" fill="none">
                    <rect x="11" y="2" width="18" height="24" rx="4" fill="currentColor" opacity=".12"/>
                    <rect x="14.5" y="7" width="11" height="3" rx="1.5" fill="currentColor"/>
                    <rect x="14.5" y="13" width="11" height="2.5" rx="1.25" fill="currentColor" opacity=".45"/>
                    <rect x="14.5" y="18.5" width="8" height="2.5" rx="1.25" fill="currentColor" opacity=".3"/>
                  </svg>
                </span>
                <span class="bsp-mode-text">
                  <span class="bsp-mode-title" data-i18n="modeSingleCenter">Centered</span>
                  <span class="bsp-mode-desc" data-i18n="modeSingleCenterDesc">Comfortable reading width</span>
                </span>
              </span>
            </label>

            <label class="bsp-mode">
              <input type="radio" name="columnMode" value="double">
              <span class="bsp-mode-card">
                <span class="bsp-mode-icon" aria-hidden="true">
                  <svg viewBox="0 0 40 28" width="40" height="28" fill="none">
                    <rect x="2" y="2" width="16" height="24" rx="3.5" fill="currentColor" opacity=".12"/>
                    <rect x="22" y="2" width="16" height="24" rx="3.5" fill="currentColor" opacity=".12"/>
                    <rect x="5" y="7" width="10" height="2.5" rx="1.25" fill="currentColor"/>
                    <rect x="25" y="7" width="10" height="2.5" rx="1.25" fill="currentColor"/>
                    <rect x="5" y="13" width="10" height="2" rx="1" fill="currentColor" opacity=".4"/>
                    <rect x="25" y="13" width="10" height="2" rx="1" fill="currentColor" opacity=".4"/>
                  </svg>
                </span>
                <span class="bsp-mode-text">
                  <span class="bsp-mode-title" data-i18n="modeDouble">Dual</span>
                  <span class="bsp-mode-desc" data-i18n="modeDoubleDesc">Side-by-side on wide screens</span>
                </span>
              </span>
            </label>
          </div>
        </section>

        <section class="bsp-section" aria-labelledby="bsp-reading-title">
          <div class="bsp-section-head">
            <h2 id="bsp-reading-title" data-i18n="reading">Reading</h2>
          </div>

          <label class="bsp-switch">
            <input type="checkbox" name="autoPage">
            <span class="bsp-switch-copy">
              <span class="bsp-switch-title" data-i18n="autoPage">Auto page</span>
              <span class="bsp-switch-desc" data-i18n="autoPageDesc">Load the next page at the bottom</span>
            </span>
            <span class="bsp-switch-track" aria-hidden="true">
              <span class="bsp-switch-thumb"></span>
            </span>
          </label>
        </section>
      </form>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
