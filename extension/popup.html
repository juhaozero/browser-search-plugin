<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>搜索结果阅读</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <form id="bsp-prefs">
      <fieldset>
        <legend>列模式</legend>
        <label><input type="radio" name="columnMode" value="original"> 原始模式</label>
        <label><input type="radio" name="columnMode" value="single"> 单列</label>
        <label><input type="radio" name="columnMode" value="single-center"> 单列居中</label>
        <label><input type="radio" name="columnMode" value="double"> 双列</label>
      </fieldset>
      <label class="toggle"><input type="checkbox" name="highlight"> 高亮</label>
      <label class="toggle"><input type="checkbox" name="autoPage"> 自动翻页</label>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
