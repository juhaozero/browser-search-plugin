name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run Chromium layout regression tests
        type: boolean
        default: false
      live:
        description: Check real search engines (may be blocked by verification pages)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- package.json package-lock.json extension/manifest.json extension/content.css

  browser:
    if: github.event_name == 'workflow_dispatch' && (inputs.browser || inputs.live)
    needs: check
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
      BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: inputs.browser
        run: npm run test:browser
      - if: inputs.live
        run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: .scratch/
          include-hidden-files: true
          if-no-files-found: ignore
